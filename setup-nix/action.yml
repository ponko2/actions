name: setup-nix
description: Set up a Nix environment
inputs:
  cachix-auth-token:
    description: Authentication token for Cachix
    required: true
  cachix-name:
    description: Name of the Cachix cache
    required: false
    default: ponko2
  cachix-skip-push:
    description: Set to `true` to only pull from Cachix without pushing any build results.
    required: false
    default: "false"
  prefetch-dependencies:
    description: Run `nix --quiet develop --command true` after setup.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Install Nix
      uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
    - name: Set up Cachix
      uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: ${{ inputs.cachix-name }}
        authToken: ${{ inputs.cachix-auth-token }}
        skipPush: ${{ inputs.cachix-skip-push }}
    - name: Prefetch Nix dependencies
      if: ${{ inputs.prefetch-dependencies == 'true' }}
      shell: bash
      run: nix --quiet develop --command true
